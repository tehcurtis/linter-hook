name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck + shfmt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Install shellcheck (Linux)
        if: runner.os == 'Linux'
        run: |
          command -v shellcheck >/dev/null 2>&1 && exit 0
          sudo apt-get update
          sudo apt-get install -y shellcheck

      # Go is preinstalled on the Linux runners but not the macOS ones, so set
      # it up explicitly rather than installing shfmt a different way per OS.
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install shfmt
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.10.0
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"

      # The .bats files are not valid sh, so shellcheck cannot read them; the
      # helper they all load is plain Bash and is checked.
      - name: shellcheck
        run: shellcheck --severity=style --shell=bash lint-hook.sh test/helpers/common.bash

      - name: shfmt (check formatting)
        run: shfmt --diff --indent 2 --case-indent lint-hook.sh test/helpers/common.bash

  bash32:
    name: Bash 3.2 syntax check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # macOS runners ship Bash 3.2 as /bin/bash, which is the oldest version
      # lint-hook supports. Parsing the script with it catches any accidental
      # use of Bash 4+ syntax (associative arrays, mapfile, case conversion).
      - name: Confirm /bin/bash is 3.2
        run: /bin/bash --version | head -1

      - name: Parse with Bash 3.2
        run: /bin/bash -n lint-hook.sh

  test:
    name: bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      # Node is preinstalled on both runners, so npm keeps this to first-party
      # actions. The suite needs bats 1.5 or newer for `run -<status>`.
      - name: Install bats
        run: npm install -g bats@1.13.0

      # The JSON/YAML/TOML checkers are the one part the stubs cannot stand in
      # for, since there the interpreter is the thing under test. Installing
      # PyYAML makes that coverage run rather than skip, on both runners.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      # The suite drives the hook through stub linters, so nothing here needs a
      # real toolchain. The data-format checkers are the exception: they are
      # the backend, so those tests skip when the backend is absent.
      - name: bats
        run: bats --print-output-on-failure test/
